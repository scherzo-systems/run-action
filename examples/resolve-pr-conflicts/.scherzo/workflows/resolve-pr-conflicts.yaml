schemaVersion: 1

description: Prepare a PR merge, resolve conflicts only when needed, and validate the result.

agentProfiles:
  resolver:
    harness:
      kind: codex
      config:
        model: gpt-5.4-mini
        effort: high

steps:
  prepare:
    kind: cmd
    inputs:
      pr:
        ref: imports.prompt
    command:
      argv: [node, ../automation/scripts/resolve-pr-conflicts.ts, prepare]
    outputs:
      needed:
        kind: text
        from: path
        path: .git/scherzo-merge-needed

  resolve:
    kind: agent
    condition:
      equals:
        - ref: outputs.prepare.needed
        - value: "true"
    agent:
      profile: resolver
      systemPrompt: ../prompts/resolve-pr-conflicts.md
      message:
        text:
          - ref: imports.prompt

  check:
    kind: cmd
    condition:
      disposition:
        node: resolve
        is: succeeded
    command:
      # Customize this command for your repository. It must fail if checks fail.
      argv:
        - sh
        - -c
        - npm ci && npm test && git diff --exit-code HEAD && test -z "$(git status --porcelain)"
    outputs:
      resolution:
        kind: git_branch
        from: workspace

exports:
  resolution:
    ref: outputs.check.resolution
